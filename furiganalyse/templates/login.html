<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to Furiganalyse Japanese ebook assistance.">
    <title>Sign In · Furiganalyse</title>
    <link href="{{ url_for('assets', path='styles.css') }}{% if app_version %}?v={{ app_version }}{% endif %}" rel="stylesheet">
    <style>
        .login-wrap {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px 60px;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 32px 32px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: var(--accent);
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            border-radius: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .login-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 0 6px;
            color: var(--ink);
        }
        .login-subtitle {
            font-size: 0.9rem;
            color: var(--muted);
            margin: 0;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--ink);
        }
        .input-group input[type="text"],
        .input-group input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-input);
            border-radius: var(--radius-small);
            background: var(--surface-card);
            color: var(--ink);
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: var(--surface);
        }
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: -4px;
        }
        .remember-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .login-btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-small);
            padding: 13px 20px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 12px var(--accent-glow);
            margin-top: 6px;
        }
        .login-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px var(--accent-glow);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-alert {
            background: var(--danger-soft);
            border: 1px solid var(--danger-border);
            color: var(--danger-text);
            padding: 12px 14px;
            border-radius: var(--radius-small);
            font-size: 0.88rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .login-footer {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--line-subtle);
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
<header class="site-header">
    <a class="brand" href="{{ url_for('get_root') }}" aria-label="Furiganalyse home">
        <span class="brand-mark" aria-hidden="true">振</span>
        <span><strong>Furiganalyse</strong><small>Japanese ebook assistance {% if app_version %}<span class="version-tag">v{{ app_version }}</span>{% endif %}</small></span>
    </a>
</header>

<main class="login-wrap">
    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-mark" aria-hidden="true">振</div>
            <h1 class="login-title">Sign in</h1>
            <p class="login-subtitle"><ruby>認証<rt>にんしょう</rt></ruby> · Protected Application Access</p>
        </div>

        {% if error_message %}
        <div class="login-alert" role="alert">
            <span aria-hidden="true">⚠️</span>
            <span>{{ error_message }}</span>
        </div>
        {% endif %}

        <form class="login-form" method="post" action="{{ url_for('post_login') }}">
            <input type="hidden" name="next" value="{{ next_url or '' }}">

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ username or 'admin' }}" required autofocus autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <div class="remember-row">
                <label>
                    <input type="checkbox" name="remember_me" value="true" checked>
                    <span>Remember me on this device</span>
                </label>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="login-footer">
            <span>Furiganalyse Engine v{{ app_version }} · Protected against automated crawlers and bots</span>
        </div>
    </div>
</main>
</body>
</html>
